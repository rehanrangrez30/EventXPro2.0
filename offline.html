<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Offline - EventX Pro</title>
<style>
  :root { --ex-primary: #2563eb; --ex-accent: #7c3aed; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #0f172a; text-align: center;
  }
  .card { max-width: 420px; padding: 2rem; }
  .icon {
    width: 72px; height: 72px; margin: 0 auto 1.25rem; border-radius: 18px;
    background: linear-gradient(135deg, var(--ex-primary), var(--ex-accent));
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.75rem;
  }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  p { color: #64748b; margin: 0 0 1.5rem; }
  button {
    background: var(--ex-primary); color: #fff; border: none; padding: .65rem 1.5rem;
    border-radius: 10px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>You're offline</h1>
    <p>EventX Pro needs an internet or local network connection to load event data. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
